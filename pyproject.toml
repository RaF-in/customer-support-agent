[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Document ingestion pipeline MVP — FastAPI + Qdrant, tenant-scoped"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "langchain-text-splitters>=0.3",
    "openai>=1.54",
    "langgraph>=1.2.22",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langchain-mcp-adapters>=0.3.2",
    "psycopg[binary,pool]>=3.2",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
