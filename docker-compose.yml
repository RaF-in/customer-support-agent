services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: customer-support-agent-qdrant
    ports:
      # Host port is overridable via QDRANT_PORT in .env (see .env.example);
      # the container always listens on 6333.
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Default boot dependency: conversation transcripts live in Postgres
  # (conversational subsystem), and it doubles as the optional checkpointer
  # backend (CHECKPOINT_BACKEND=postgres). Starts with plain
  # `docker compose up -d` — no profile flag needed anymore.
  # Credentials must match POSTGRES_DSN in .env (default app:app@localhost:5432/app).
  postgres:
    image: postgres:17
    container_name: customer-support-agent-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
