services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: customer-support-agent-qdrant
    ports:
      # Host port is overridable via QDRANT_PORT in .env (see .env.example);
      # the container always listens on 6333.
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Default boot dependency: the row-state substrate — conversation
  # transcripts, plan records, approval requests, action-result audit.
  # Starts with plain `docker compose up -d` — no profile flag needed.
  #
  # Two roles. `POSTGRES_USER` (app, a superuser — it ignores row-level
  # security) only owns the schema: the app creates tables and policies with
  # it at boot (POSTGRES_ADMIN_DSN). The application pool connects as the
  # ordinary role created by docker/postgres/01-app-role.sh, which the
  # tenant-isolation policies DO apply to (POSTGRES_DSN). The init script
  # runs once, when the data volume is first created.
  # APP_RW_PASSWORD must match POSTGRES_DSN in .env; change both together.
  postgres:
    image: postgres:17
    container_name: customer-support-agent-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      APP_RW_USER: app_rw
      APP_RW_PASSWORD: "${POSTGRES_RW_PASSWORD:-app_rw}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
